<main id="main" tabindex="-1">
  <canvas id="tour-canvas"></canvas>

  <div class="tour-info" id="room-info">

  <div class="tour-controls" id="controls">
    <button class="tour-btn on" data-room="twin" data-beds="2" aria-label="View twin-sharing room">
      Twin Room
      <span class="tooltip" aria-hidden="true">Twin-Sharing · 2 beds</span>

  <style>
    .tour-mail{position:fixed;top:1.1rem;right:1.1rem;z-index:20;font-family:var(--font-ui,system-ui);font-size:.78rem;letter-spacing:.02em;padding:.55rem 1rem;border-radius:99px;background:#c05621;color:#faf6f0;text-decoration:none;box-shadow:0 6px 18px -8px rgba(58,50,42,.5)}
    .tour-mail:focus-visible{outline:2px solid #3a322a;outline-offset:3px}
    @media(max-width:600px){.tour-mail{top:auto;bottom:5.4rem;right:.8rem;font-size:.74rem;padding:.5rem .85rem}}
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const canvas = document.getElementById('tour-canvas');
    const fade = document.getElementById('fade-overlay');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xfaf6f0);
    scene.fog = new THREE.Fog(0xfaf6f0, 6, 28);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.6, 4.5);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 2.2;
    controls.maxDistance = 9;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.target.set(0, 1.05, 0);
    controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY };

    // Warm daylight with soft AO-like shading via hemisphere
    const hemi = new THREE.HemisphereLight(0xfff4e0, 0x3a2f28, 0.55);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff3e0, 1.15);
    sun.position.set(4, 8, 4);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 25;
    sun.shadow.camera.left = -8;
    sun.shadow.camera.right = 8;
    sun.shadow.camera.top = 8;
    sun.shadow.camera.bottom = -8;
    sun.shadow.bias = -0.0005;
    scene.add(sun);

    const warm = new THREE.PointLight(0xffaa5e, 12, 6);
    warm.position.set(-3, 2, 3);
    scene.add(warm);

    const fill = new THREE.PointLight(0x7ab8d0, 8, 6);
    fill.position.set(3, 2.2, -3);
    scene.add(fill);

    // Materials
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xf5efe6, roughness: 0.92, metalness: 0 });
    const floorMat = new THREE.MeshStandardMaterial({ color: 0xd4c4b0, roughness: 0.75, metalness: 0.05 });
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x8b6f47, roughness: 0.65, metalness: 0.05 });
    const fabricMat = new THREE.MeshStandardMaterial({ color: 0xfaf6f0, roughness: 0.95, metalness: 0 });
    const metalMat = new THREE.MeshStandardMaterial({ color: 0xcdc4b6, roughness: 0.4, metalness: 0.6 });

    const loader = new THREE.TextureLoader();
    const img = (p) => 'assets/g/' + p;

    const rooms = {
      twin: {
        name: 'Twin-Sharing Room',
        desc: 'Comfortable 10x12 ft space with wardrobe, study desk, and home-style meals. Built for professionals who value simplicity and function.',
        photo: img('twin.jpg'),
        accent: 0xc05621,
        cam: { pos: [0, 1.6, 4.5], target: [0, 1.05, 0] }
      },
      single: {
        name: 'Single Room',
        desc: 'Private 12x15 ft room with full lockable space, ensuite access, and premium furnishing. Your own sanctuary after a long shift.',
        photo: img('single.jpg'),
        accent: 0xd9a441,
        cam: { pos: [0, 1.6, 4.2], target: [0, 1.05, -0.3] }
      },
      common: {
        name: 'Common Floor',
        desc: 'Full ground floor with kitchen, dining hall, living room with TV, and reception. This is where the community lives.',
        photo: img('kitchen-dining.jpg'),
        accent: 0x6b8e4e,
        cam: { pos: [0, 2.0, 6], target: [0, 0.9, -1] }
      },
      living: {
        name: 'Living Area',
        desc: 'Open common space with sofas, TV, and a home-style dining setup. The heart of Prajna Co-hab.',
        photo: img('living.jpg'),
        accent: 0x5b8c9e,
        cam: { pos: [0, 1.7, 5], target: [0, 1.0, -0.5] }
      }
    };

    const roomGroup = new THREE.Group();
    scene.add(roomGroup);
    const reflectionGroup = new THREE.Group();
    scene.add(reflectionGroup);

    function setTexture(mat, path) {
      const tex = loader.load(path);
      tex.colorSpace = THREE.SRGBColorSpace;
      mat.map = tex;
      mat.needsUpdate = true;
    }

    function clearGroup(g) {
      while (g.children.length) {
        const c = g.children[0];
        if (c.geometry) c.geometry.dispose();
        if (c.material) {
          if (c.material.map) c.material.map.dispose();
          c.material.dispose();
        }
        g.remove(c);
      }
    }

    function buildReflection(key) {
      clearGroup(reflectionGroup);
      const r = rooms[key];
      const photoMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55, metalness: 0, transparent: true, opacity: 0.18 });
      setTexture(photoMat, r.photo);

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.MeshStandardMaterial({ color: 0xd4c4b0, roughness: 0.75, metalness: 0.85, transparent: true, opacity: 0.35 }));
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.02;
      reflectionGroup.add(floor);

      const back = new THREE.Mesh(new THREE.PlaneGeometry(8, 2.85), photoMat);
      back.position.set(0, 1.425, -4);
      reflectionGroup.add(back);

      const left = new THREE.Mesh(new THREE.PlaneGeometry(8, 2.85), new THREE.MeshStandardMaterial({ color: 0xf5efe6, roughness: 0.92, metalness: 0, transparent: true, opacity: 0.15 }));
      left.rotation.y = Math.PI / 2;
      left.position.set(-4, 1.425, 0);
      reflectionGroup.add(left);

      const right = new THREE.Mesh(new THREE.PlaneGeometry(8, 2.85), new THREE.MeshStandardMaterial({ color: 0xf5efe6, roughness: 0.92, metalness: 0, transparent: true, opacity: 0.15 }));
      right.rotation.y = -Math.PI / 2;
      right.position.set(4, 1.425, 0);
      reflectionGroup.add(right);

      reflectionGroup.scale.y = -1;
    }

    function buildRoom(key) {
      clearGroup(roomGroup);

      const r = rooms[key];
      const photoMat = new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0 });
      setTexture(photoMat, r.photo);

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      roomGroup.add(floor);

      const ceil = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), wallMat);
      ceil.rotation.x = Math.PI / 2;
      ceil.position.y = 2.85;
      roomGroup.add(ceil);

      const back = new THREE.Mesh(new THREE.PlaneGeometry(8, 2.85), photoMat);
      back.position.set(0, 1.425, -4);
      roomGroup.add(back);

      const left = new THREE.Mesh(new THREE.PlaneGeometry(8, 2.85), wallMat);
      left.rotation.y = Math.PI / 2;
      left.position.set(-4, 1.425, 0);
      roomGroup.add(left);

      const right = new THREE.Mesh(new THREE.PlaneGeometry(8, 2.85), wallMat);
      right.rotation.y = -Math.PI / 2;
      right.position.set(4, 1.425, 0);
      roomGroup.add(right);

      const fLeft = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 2.85), wallMat);
      fLeft.rotation.y = Math.PI;
      fLeft.position.set(-2.7, 1.425, 4);
      roomGroup.add(fLeft);

      const fRight = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 2.85), wallMat);
      fRight.rotation.y = Math.PI;
      fRight.position.set(2.7, 1.425, 4);
      roomGroup.add(fRight);

      const fTop = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 0.55), wallMat);
      fTop.rotation.y = Math.PI;
      fTop.position.set(0, 2.58, 4);
      roomGroup.add(fTop);

      const bed = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.45, 2.9), woodMat);
      bed.position.set(0, 0.22, -1.9);
      bed.castShadow = true;
      roomGroup.add(bed);

      const mattress = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.22, 2.8), fabricMat);
      mattress.position.set(0, 0.55, -1.9);
      mattress.castShadow = true;
      roomGroup.add(mattress);

      const desk = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.06, 0.85), woodMat);
      desk.position.set(-3.1, 0.82, -2.6);
      desk.castShadow = true;
      roomGroup.add(desk);

      const chair = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.85, 0.55), new THREE.MeshStandardMaterial({ color: r.accent, roughness: 0.6 }));
      chair.position.set(-3.1, 0.42, -1.85);
      chair.castShadow = true;
      roomGroup.add(chair);

      const lamp = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.18, 0.06, 20), metalMat);
      lamp.position.set(-3.1, 1.0, -2.6);
      roomGroup.add(lamp);

      const lampLight = new THREE.PointLight(0xffaa5e, 7, 3.5);
      lampLight.position.set(-3.1, 1.45, -2.6);
      roomGroup.add(lampLight);

      const wardrobe = new THREE.Mesh(new THREE.BoxGeometry(1.4, 2.2, 0.6), woodMat);
      wardrobe.position.set(3.6, 1.1, -3.2);
      wardrobe.castShadow = true;
      roomGroup.add(wardrobe);

      const rail = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.08, 0.08), metalMat);
      rail.position.set(0, 1.1, -3.92);
      roomGroup.add(rail);

      const info = document.getElementById('room-info');
      if (info) {
        info.querySelector('h2').textContent = r.name;
        info.querySelector('p').textContent = r.desc;
      }
    }

    // Transition system
    let transitioning = false;
    let currentRoom = 'twin';

    function lerp(a, b, t) { return a + (b - a) * t; }

    function flyTo(key) {
      if (transitioning || key === currentRoom) return;
      transitioning = true;
      fade.style.opacity = '1';

      setTimeout(() => {
        buildRoom(key);
        buildReflection(key);
        currentRoom = key;

        const start = { x: camera.position.x, y: camera.position.y, z: camera.position.z };
        const startTarget = { x: controls.target.x, y: controls.target.y, z: controls.target.z };
        const end = rooms[key].cam.pos;
        const endTarget = rooms[key].cam.target;
        const dur = 900;
        const t0 = performance.now();

        function step(now) {
          const t = Math.min((now - t0) / dur, 1);
          const ease = t < 0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
          camera.position.set(lerp(start.x, end[0], ease), lerp(start.y, end[1], ease), lerp(start.z, end[2], ease));
          controls.target.set(lerp(startTarget.x, endTarget[0], ease), lerp(startTarget.y, endTarget[1], ease), lerp(startTarget.z, endTarget[2], ease));
          if (t < 1) {
            requestAnimationFrame(step);
          } else {
            fade.style.opacity = '0';
            transitioning = false;
          }
        }
        requestAnimationFrame(step);
      }, 320);
    }

    document.querySelectorAll('.tour-btn[data-room]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tour-btn[data-room]').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        flyTo(btn.dataset.room);
      });
    });

    // Auto-rotate toggle
    const autoBtn = document.getElementById('auto-rotate-btn');
    autoBtn.addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      controls.autoRotateSpeed = 1.5;
      autoBtn.classList.toggle('on', controls.autoRotate);
      autoBtn.setAttribute('aria-pressed', String(controls.autoRotate));
      autoBtn.querySelector('.tooltip').textContent = 'Auto-rotate: ' + (controls.autoRotate ? 'on' : 'off');
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    buildRoom('twin');
    buildReflection('twin');

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
